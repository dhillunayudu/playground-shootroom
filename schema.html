<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shootroom — Schema diagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bone:#F6F4F0; --bone-2:#EDEAE4; --bone-3:#E4E0D8; --ink:#0E0E0E;
  --ink-70:rgba(14,14,14,.70); --ink-45:rgba(14,14,14,.45); --ink-22:rgba(14,14,14,.22);
  --hair:rgba(14,14,14,.13); --P:#2F4A7A; --danger:#B4241F;
  --grid:rgba(14,14,14,.09); --link:rgba(14,14,14,.22); --linkdim:rgba(14,14,14,.07);
  --zebra:rgba(14,14,14,.016);
  --sh1:0 1px 2px rgba(14,14,14,.05); --sh2:0 8px 22px rgba(14,14,14,.07);
  --sh3:0 12px 30px rgba(47,74,122,.18);
  --f:Manrope,system-ui,sans-serif; --m:'IBM Plex Mono',monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}

/* Dark is a token swap only. Structure, spacing and type are unchanged —
   the schema reads the same, the surface behind it does not. */
html[data-theme="dark"]{
  --bone:#14161A; --bone-2:#1C1F25; --bone-3:#252932; --ink:#E9E7E2;
  --ink-70:rgba(233,231,226,.72); --ink-45:rgba(233,231,226,.46); --ink-22:rgba(233,231,226,.22);
  --hair:rgba(233,231,226,.14); --P:#8AA0F0; --danger:#E0736A;
  --grid:rgba(233,231,226,.07); --link:rgba(233,231,226,.20); --linkdim:rgba(233,231,226,.06);
  --zebra:rgba(233,231,226,.028);
  --sh1:0 1px 2px rgba(0,0,0,.4); --sh2:0 8px 22px rgba(0,0,0,.45);
  --sh3:0 12px 30px rgba(138,160,240,.22);
}
html{color-scheme:light;}
html[data-theme="dark"]{color-scheme:dark;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bone);color:var(--ink);font-family:var(--f);font-size:14px;
  -webkit-font-smoothing:antialiased;transition:background .25s var(--ease),color .25s var(--ease);}
button{background:none;border:0;cursor:pointer;font:inherit;color:inherit;}
:focus-visible{outline:1.5px solid var(--P);outline-offset:2px;}
.mono{font-family:var(--m);font-size:10px;letter-spacing:.06em;text-transform:uppercase;}

.app{display:grid;grid-template-columns:236px 1fr;height:100vh;}

/* ---------- rail ---------- */
.rail{border-right:1px solid var(--hair);display:flex;flex-direction:column;min-height:0;}
.rh{padding:16px 18px;border-bottom:1px solid var(--hair);}
.rh .w{font-weight:700;font-size:18px;letter-spacing:-.025em;}
.rh .w i{font-style:normal;color:var(--P);}
.rh .s{font-family:var(--m);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-45);margin-top:6px;}
.search{padding:12px 14px;border-bottom:1px solid var(--hair);}
.search input{width:100%;border:1px solid var(--hair);background:var(--bone-2);border-radius:7px;padding:8px 11px;font-size:12.5px;}
.search input:focus{outline:0;border-color:var(--ink);background:var(--bone);}
.list{flex:1;overflow-y:auto;padding:8px 0 20px;}
.list::-webkit-scrollbar{width:3px;}
.list::-webkit-scrollbar-thumb{background:var(--ink-22);}
.grp{display:flex;align-items:center;gap:8px;font-family:var(--m);font-size:9px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-45);padding:14px 16px 6px;}
.grp i{width:8px;height:8px;border-radius:2px;}
.ti{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:6px 16px;font-size:12.5px;color:var(--ink-70);}
.ti:hover{background:var(--bone-2);color:var(--ink);}
.ti.on{background:var(--ink);color:var(--bone);font-weight:600;}
.ti .n{margin-left:auto;font-family:var(--m);font-size:9px;opacity:.5;}

/* ---------- canvas ---------- */
.stage{position:relative;overflow:hidden;background:
  radial-gradient(circle at 1px 1px, var(--grid) 1px, transparent 0) 0 0/22px 22px;
  cursor:grab;}
.stage.drag{cursor:grabbing;}
.world{position:absolute;top:0;left:0;transform-origin:0 0;}
svg.links{position:absolute;top:0;left:0;overflow:visible;pointer-events:none;}
svg.links path{fill:none;stroke:var(--link);stroke-width:1.4;}
svg.links path.hot{stroke:var(--P);stroke-width:2.2;}
svg.links path.dim{stroke:var(--linkdim);}

.tbl{position:absolute;width:246px;background:var(--bone);border:1px solid var(--hair);border-radius:10px;
  box-shadow:var(--sh1),var(--sh2);overflow:hidden;transition:opacity .2s var(--ease);}
.tbl.sel{border-color:var(--P);box-shadow:0 0 0 1.5px var(--P),var(--sh3);}
.tbl.dim{opacity:.24;}
.tbl h3{display:flex;align-items:center;gap:8px;font-family:var(--m);font-size:11px;letter-spacing:.02em;
  padding:9px 11px;background:var(--bone-2);border-bottom:1px solid var(--hair);cursor:grab;font-weight:500;}
.tbl h3 .dot{width:8px;height:8px;border-radius:2px;flex:0 0 auto;}
html[data-theme="dark"] .tbl h3 .dot,
html[data-theme="dark"] .grp i,
html[data-theme="dark"] .dh .g span{filter:saturate(1.5) brightness(1.75);}
.tbl h3 .cnt{margin-left:auto;font-size:9px;color:var(--ink-45);}
.done{width:7px;height:7px;border-radius:50%;background:#3E7A4E;flex:0 0 auto;
  box-shadow:0 0 0 2px rgba(62,122,78,.18);}
.done.pending{background:transparent;box-shadow:inset 0 0 0 1px var(--ink-22);}
html[data-theme="dark"] .done:not(.pending){background:#5FA772;box-shadow:0 0 0 2px rgba(95,167,114,.2);}
html[data-theme="dark"] .done.pending{background:transparent;box-shadow:inset 0 0 0 1px var(--ink-22);}
.tbl h3 .done{margin-right:1px;}
.ti .done{margin-right:1px;}
.tbl ul{list-style:none;}
.tbl li{display:flex;align-items:baseline;gap:7px;padding:3.5px 11px;font-family:var(--m);font-size:10px;line-height:1.4;}
.tbl li:nth-child(odd){background:var(--zebra);}
.tbl li .k{width:15px;flex:0 0 auto;font-size:8px;letter-spacing:0;}
.tbl li .k.pk{color:var(--P);font-weight:600;}
.tbl li .k.fk{color:var(--danger);}
.tbl li .c{color:var(--ink);}
.tbl li .t{margin-left:auto;color:var(--ink-45);font-size:9px;white-space:nowrap;}
.tbl li.nn .c{font-weight:500;}
.tbl.keys li:not(.iskey){display:none;}

/* ---------- controls ---------- */
.ctl{position:absolute;top:14px;right:14px;display:flex;gap:7px;z-index:20;flex-wrap:wrap;justify-content:flex-end;}
.cb{background:var(--bone);border:1px solid var(--hair);border-radius:7px;padding:8px 12px;
  font-family:var(--m);font-size:9px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;
  box-shadow:var(--sh1);}
.cb:hover{border-color:var(--ink);}
.cb.on{background:var(--ink);color:var(--bone);border-color:var(--ink);}

.legend{position:absolute;left:14px;bottom:14px;background:var(--bone);border:1px solid var(--hair);
  border-radius:9px;padding:11px 13px;z-index:20;box-shadow:var(--sh1),var(--sh2);}
.legend .r{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-70);padding:2px 0;}
.legend .r span.k{font-family:var(--m);font-size:8px;width:15px;}

/* ---------- detail ---------- */
.detail{position:absolute;right:14px;top:60px;width:320px;max-height:calc(100vh - 90px);overflow-y:auto;
  background:var(--bone);border:1px solid var(--hair);border-radius:12px;z-index:20;display:none;
  box-shadow:var(--sh1),var(--sh2);}
.detail.on{display:block;}
.detail::-webkit-scrollbar{width:3px;}
.detail::-webkit-scrollbar-thumb{background:var(--ink-22);}
.dh{padding:14px 16px;border-bottom:1px solid var(--hair);display:flex;align-items:flex-start;gap:10px;}
.dh .t{font-family:var(--m);font-size:13px;font-weight:500;}
.dh .g{font-size:11px;color:var(--ink-45);margin-top:4px;}
.dh .x{margin-left:auto;font-size:16px;color:var(--ink-45);line-height:1;}
.db{padding:14px 16px 18px;}
.db p{font-size:12.5px;color:var(--ink-70);line-height:1.6;margin-bottom:14px;}
.db h4{font-family:var(--m);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-45);
  padding-bottom:7px;border-bottom:1px solid var(--hair);margin:16px 0 9px;font-weight:600;}
.db h4:first-child{margin-top:0;}
.rel{display:flex;align-items:center;gap:8px;font-size:11.5px;padding:5px 0;}
.rel .a{font-family:var(--m);font-size:10px;color:var(--P);}
.rel .b{color:var(--ink-45);}
.db button.jump{font-family:var(--m);font-size:10px;color:var(--P);text-decoration:underline;text-underline-offset:3px;}

@media (max-width:900px){.app{grid-template-columns:1fr;}.rail{display:none;}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="rh"><div class="w">Shootroom<i>.</i></div><div class="s">Schema · <span id="prog"></span></div></div>
    <div class="search"><input id="q" placeholder="Find a table or column"></div>
    <div class="list" id="list"></div>
  </aside>

  <div class="stage" id="stage">
    <div class="ctl">
      <button class="cb" data-z="in">Zoom +</button>
      <button class="cb" data-z="out">Zoom −</button>
      <button class="cb" data-z="fit">Fit</button>
      <button class="cb" id="keysBtn">Keys only</button>
      <button class="cb" id="relBtn">Hide links</button>
      <button class="cb" id="themeBtn" title="Toggle dark mode">Dark</button>
    </div>
    <div class="legend">
      <div class="r"><span class="k" style="color:var(--P);font-weight:600">PK</span> Primary key</div>
      <div class="r"><span class="k" style="color:var(--danger)">FK</span> Foreign key</div>
      <div class="r"><span class="k">◇</span> Nullable</div>
      <div class="r"><span class="done" style="margin-right:7px"></span> Reviewed and finalised</div>
      <div class="r" style="margin-top:5px;color:var(--ink-45);font-size:10.5px">Drag a table to move it · click to inspect</div>
    </div>
    <div class="detail" id="detail"></div>
    <div class="world" id="world">
      <svg class="links" id="links"></svg>
    </div>
  </div>
</div>

<script>
(function(){
var $=function(s){return document.querySelector(s);};

/* ============ domains ============ */
var G={
 access:  {label:'Identity and access', c:'#2F4A7A', col:0},
 settings:{label:'Settings',            c:'#5D4E6B', col:1},
 billing: {label:'Billing and Credits', c:'#1F5A5E', col:2},
 taxonomy:{label:'Catalogue taxonomy',  c:'#8A5A2B', col:3},
 master:  {label:'Master data',         c:'#7A5A2E', col:3},
 product: {label:'Products',            c:'#A2513A', col:4},
 library: {label:'Model library',       c:'#4A5D34', col:5},
 shoot:   {label:'Shoots',              c:'#6B2D4E', col:6},
 ops:     {label:'Operations',          c:'#3F4E5A', col:7}
};

/* c = column spec: "Name|Type|flags"  flags: p=pk f=fk n=nullable */
function T(n,g,note,cols){ return {name:n,g:g,note:note,cols:cols.map(function(s){
  var a=s.split('|'); return {n:a[0],t:a[1],f:a[2]||''};
})}; }

var TABLES=[
/* ---- access ---- */
T('Clients','access','The tenant. Its state gates every request before role is considered.',
 ['Id|CHAR(26)|p','Name|VARCHAR(200)','CountryCode|CHAR(2)','CurrencyCode|CHAR(3)',
  'State|ENUM','StateReason|VARCHAR|n','TrialStartedAt|DATETIME|n','TrialEndsAt|DATETIME|n',
  'TermsVersion|VARCHAR|n','TermsAcceptedAt|DATETIME|n','CreatedAt|DATETIME','DeletedAt|DATETIME|n','PurgeAfter|DATETIME|n']),
T('Users','access','A person. May belong to more than one Clients.',
 ['Id|CHAR(26)|p','Email|VARCHAR(320)','EmailNormalised|VARCHAR(320)','PasswordHash|VARCHAR',
  'FullName|VARCHAR(200)','AvatarUri|VARCHAR|n','EmailVerifiedAt|DATETIME|n',
  'LockedUntil|DATETIME|n','FailedLoginCount|SMALLINT','LastLoginAt|DATETIME|n','CreatedAt|DATETIME']),
T('UserAccess','access','The join between user and Clients. Role and credit cap live here, not on the user.',
 ['Id|CHAR(26)|p','ClientId|CHAR(26)|f','UserId|CHAR(26)|f','Role|ENUM',
  'CreditCapMonthly|INT|n','IsBillable|TINYINT','Status|ENUM','InvitedBy|CHAR(26)|n','JoinedAt|DATETIME|n',
  'LastActiveAt|DATETIME|n','CreatedAt|DATETIME']),
T('Invitations','access','Single-use, expires in 7 days.',
 ['Id|CHAR(26)|p','ClientId|CHAR(26)|f','EmailNormalised|VARCHAR','Role|ENUM',
  'TokenHash|CHAR(64)','InvitedBy|CHAR(26)','ExpiresAt|DATETIME','AcceptedAt|DATETIME|n','RevokedAt|DATETIME|n']),
T('AuthTokens','access','Activation, password reset OTP, email change. Hash only, never the raw value.',
 ['Id|CHAR(26)|p','UserId|CHAR(26)|f','Kind|ENUM','TokenHash|CHAR(64)',
  'TargetEmail|VARCHAR|n','Attempts|SMALLINT','ExpiresAt|DATETIME','ConsumedAt|DATETIME|n']),
T('Sessions','access','Refresh tokens and impersonation. Password reset revokes all.',
 ['Id|CHAR(26)|p','UserId|CHAR(26)|f','ClientId|CHAR(26)|n','RefreshTokenHash|CHAR(64)',
  'UserAgent|VARCHAR|n','IpAddress|VARBINARY|n','ImpersonatedBy|CHAR(26)|n',
  'ImpersonationReason|VARCHAR|n','ExpiresAt|DATETIME','RevokedAt|DATETIME|n']),
T('StaffUsers','access','Internal staff. A separate identity space from customers by design.',
 ['Id|CHAR(26)|p','Email|VARCHAR(320)','FullName|VARCHAR(200)','Status|ENUM','CreatedAt|DATETIME']),
T('StaffRoles','access','Additive. One person may hold several roles.',
 ['StaffUserId|CHAR(26)|pf','Role|ENUM|p','GrantedBy|CHAR(26)|n','GrantedAt|DATETIME']),

/* ---- settings ---- */
T('ClientSettings','settings','Approval switch, watermark configuration, disclosure decision.',
 ['ClientId|CHAR(26)|pf','RequireApproval|TINYINT','WatermarkEnabled|TINYINT',
  'WatermarkText|VARCHAR|n','WatermarkPosition|ENUM','WatermarkOpacity|DECIMAL',
  'DisclosureDecision|ENUM','DisclosureDecidedBy|CHAR(26)|n','DisclosureDecidedAt|DATETIME|n']),
T('NotificationPreferences','settings','Per user, per category. Transactional mail is not listed — it cannot be disabled.',
 ['ClientId|CHAR(26)|p','UserId|CHAR(26)|p','Category|ENUM|p','EmailEnabled|TINYINT','InAppEnabled|TINYINT']),

/* ---- billing ---- */
T('Plans','billing','Entitlements. Bookable models sit here.',
 ['Id|CHAR(26)|p','Code|VARCHAR(40)','Name|VARCHAR(80)','StripeProductId|VARCHAR|n',
  'MonthlyCredits|INT','RolloverCapCredits|INT|n','MaxPauseDays|SMALLINT|n','ProductLimit|INT|n','StorageGb|INT|n','IncludedSeats|SMALLINT',
  'MaxPaidSeats|SMALLINT|n','ViewerLimit|SMALLINT','BookableModels|SMALLINT','IsPublic|TINYINT']),
T('PlanPrices','billing','A plan has a price per currency and interval, and separately a per-seat price.',
 ['Id|CHAR(26)|p','PlanId|CHAR(26)|f','ItemType|ENUM','StripePriceId|VARCHAR','CurrencyCode|CHAR(3)',
  'IntervalUnit|ENUM','AmountMinor|INT','IsActive|TINYINT']),
T('Subscriptions','billing','Mirrors Stripe. next_credit_release_at drives the monthly release job on annual plans.',
 ['Id|CHAR(26)|p','ClientId|CHAR(26)|f','PlanId|CHAR(26)|f','PlanPriceId|CHAR(26)|f',
  'StripeSubscriptionId|VARCHAR','Status|ENUM','IntervalUnit|ENUM',
  'CurrentPeriodStart|DATETIME','CurrentPeriodEnd|DATETIME','IncludedSeats|SMALLINT','PaidSeats|SMALLINT',
  'StripeSeatItemId|VARCHAR|n','NextCreditReleaseAt|DATETIME|n','ReleasesRemaining|SMALLINT|n',
  'PausedAt|DATETIME|n','PauseEndsAt|DATETIME|n','PauseDaysUsedThisYear|SMALLINT',
  'CancelAtPeriodEnd|TINYINT','CanceledAt|DATETIME|n']),
T('SubscriptionPeriods','billing','One row per billing cycle. Subscriptions holds current state; this holds the history. Rows are never edited.',
 ['Id|CHAR(26)|p','ClientId|CHAR(26)|f','SubscriptionId|CHAR(26)|f','PeriodStart|DATETIME','PeriodEnd|DATETIME',
  'PlanId|CHAR(26)|f','PlanPriceId|CHAR(26)|f','IncludedSeats|SMALLINT','PaidSeats|SMALLINT',
  'TotalAmountMinor|INT','InvoiceId|CHAR(26)|n','ChangeReason|ENUM','Status|ENUM']),
T('UsageSnapshots','billing','One row per client per month. ClientUsage answers today; this answers June, without aggregating the ledger.',
 ['Id|CHAR(26)|p','ClientId|CHAR(26)|f','PeriodYear|SMALLINT','PeriodMonth|SMALLINT',
  'CreditsOpening|INT','CreditsGranted|INT','CreditsPurchased|INT','CreditsConsumed|INT',
  'CreditsExpired|INT','CreditsRolledOver|INT','CreditsClosing|INT','ImagesDelivered|INT',
  'StorageBytesEnd|BIGINT','BillableSeats|SMALLINT','CapturedAt|DATETIME']),
T('CreditPacks','billing','Top-up packs, sold outside the Subscriptions.',
 ['Id|CHAR(26)|p','Code|VARCHAR(40)','Credits|INT','StripePriceId|VARCHAR',
  'CurrencyCode|CHAR(3)','AmountMinor|INT','IsActive|TINYINT']),
T('CreditLedger','billing','THE AUTHORITY for balance. Append only, signed deltas. Never mutate.',
 ['Id|CHAR(26)|p','ClientId|CHAR(26)|f','UserAccessId|CHAR(26)|n','EntryType|ENUM',
  'Delta|INT','BalanceAfter|INT','CreditSource|ENUM','ExpiresAt|DATETIME|n',
  'RunId|CHAR(26)|n','RunImageId|CHAR(26)|n','InvoiceId|CHAR(26)|n',
  'Reason|VARCHAR|n','CreatedByStaffId|CHAR(26)|n','CreatedAt|DATETIME']),
T('CreditBalances','billing','Cache of the ledger, with a version column for optimistic concurrency.',
 ['ClientId|CHAR(26)|pf','Balance|INT','Reserved|INT','TrialBalance|INT','Version|INT','UpdatedAt|DATETIME']),
T('Invoices','billing','Mirrored from Stripe. Revenue comes from here, never from summing SubscriptionPeriods — that double-counts upgrades and omits packs.',
 ['Id|CHAR(26)|p','ClientId|CHAR(26)|f','StripeInvoiceId|VARCHAR','Number|VARCHAR(40)',
  'CurrencyCode|CHAR(3)','SubtotalMinor|INT','TaxMinor|INT','TotalMinor|INT',
  'Status|ENUM','IssuedAt|DATETIME|n','PaidAt|DATETIME|n','PdfUri|VARCHAR|n']),
T('BillingProfiles','billing','Address and tax identity, populated from the provider checkout. StripeCustomerId lives here and nowhere else. No row until first checkout.',
 ['ClientId|CHAR(26)|pf','LegalName|VARCHAR|n','BillingEmail|VARCHAR|n','AddressLine1|VARCHAR|n',
  'City|VARCHAR|n','PostalCode|VARCHAR|n','CountryCode|CHAR(2)|n','TaxIdType|VARCHAR|n',
  'TaxIdValue|VARCHAR|n','StripeCustomerId|VARCHAR|n']),
T('StripeEvents','billing','Webhook idempotency — the provider event id is the primary key, so a duplicate delivery is rejected by the database. ClientId is denormalised for support lookups.',
 ['StripeEventId|VARCHAR(80)|p','Type|VARCHAR(80)','ClientId|CHAR(26)|n','StripeCustomerId|VARCHAR|n',
  'Payload|JSON','Attempts|SMALLINT','ProcessedAt|DATETIME|n','Error|TEXT|n','ReceivedAt|DATETIME']),

/* ---- master ---- */
T('Brands','master','Client-owned. Archived, never deleted, when in use. Carries full authorship — a rename propagates across every product.',
 ['Id|CHAR(26)|p','ClientId|CHAR(26)|f','Name|VARCHAR(120)','Code|VARCHAR(20)|n','Status|ENUM','ArchivedBy|CHAR(26)|n','ArchivedAt|DATETIME|n','CreatedBy|CHAR(26)|n','CreatedAt|DATETIME','UpdatedBy|CHAR(26)|n','UpdatedAt|DATETIME']),
T('Segments','taxonomy','Menswear, Womenswear, Swimwear, Nightwear. A SAFETY BOUNDARY, not a marketing label. Global, Super admin only, granted per client. Controls which products a client may shoot and which models may be paired with them.',
 ['Id|CHAR(26)|p','Code|VARCHAR(40)','Name|VARCHAR(120)','RequiresApproval|TINYINT','IsSensitive|TINYINT','RequiresModelPairing|TINYINT','IsActive|TINYINT','SortOrder|SMALLINT']),
T('Categories','taxonomy','Shirts, Jeans, Dresses. Descriptive, for filtering. Carries PlateType as a quiet system field the user never picks — it decides which half of the body the try-on replaces.',
 ['Id|CHAR(26)|p','Code|VARCHAR(40)','Name|VARCHAR(120)','PlateType|ENUM','RequiresApproval|TINYINT','IsActive|TINYINT']),
T('SubCategories','taxonomy','Shirts, Jeans, Crop tops. NOT descriptive — BaseCut decides where the base garment on the plate ends, and a crop top onto a full-length tank leaves the tank showing. Also carries gender applicability.',
 ['Id|CHAR(26)|p','CategoryId|CHAR(26)|f','Code|VARCHAR(40)','Name|VARCHAR(120)','BaseCut|ENUM','GenderApplicability|ENUM','RequiresApproval|TINYINT','IsActive|TINYINT']),
T('SegmentModels','taxonomy','THE SAFETY CONTROL. Enabling a segment creates a pending row per model; a reviewer approves or rejects each. The filter reads approved and not revoked, nothing else.',
 ['SegmentId|CHAR(26)|pf','ModelId|CHAR(26)|pf','Status|ENUM','DecidedByStaffId|CHAR(26)|n','DecidedAt|DATETIME|n',
  'DecisionNotes|VARCHAR|n','RevokedByStaffId|CHAR(26)|n','RevokedAt|DATETIME|n','RevocationReason|VARCHAR|n']),
T('ClientEntitlements','taxonomy','One row per gated item a client has requested or been granted. No row means not granted.',
 ['Id|CHAR(26)|p','ClientId|CHAR(26)|f','ScopeType|ENUM','ScopeId|CHAR(26)','Status|ENUM','RequestedBy|CHAR(26)|n',
  'DecidedByStaffId|CHAR(26)|n','DecidedAt|DATETIME|n','Notes|VARCHAR|n']),
T('Tags','taxonomy','GLOBAL and Super-admin owned, not client master data. A tag mapped to a sub-category fixes the generation prompt for that garment, so the vocabulary cannot be per client.',
 ['Id|CHAR(26)|p','Code|VARCHAR(40)','Name|VARCHAR(80)','Kind|ENUM','PromptFragment|VARCHAR|n','IsActive|TINYINT',
  'SortOrder|SMALLINT','CreatedByStaffId|CHAR(26)|n','CreatedAt|DATETIME','UpdatedByStaffId|CHAR(26)|n','UpdatedAt|DATETIME']),
T('SubCategoryTags','taxonomy','Which tags are offered for which garment. A polo offers a collar, not a floor length. Unmapped tags are hidden, not greyed.',
 ['SubCategoryId|CHAR(26)|pf','TagId|CHAR(26)|pf','IsDefault|TINYINT','SortOrder|SMALLINT']),
T('Colours','master','Carries a hex swatch used on product cards and filters.',

/* ============ layout ============ */
var COLW=290, GAPY=26, PADX=40, PADY=40;
var byName={}; TABLES.forEach(function(t){byName[t.name]=t;});
var colY={};
TABLES.forEach(function(t){
  var c=G[t.g].col;
  if(colY[c]===undefined) colY[c]=PADY;
  t.x = PADX + c*COLW;
  t.y = colY[c];
  t.h = 34 + t.cols.length*17 + 6;
  colY[c] = t.y + t.h + GAPY;
});

var world=$('#world'), links=$('#links'), stage=$('#stage');
var view={x:0,y:0,k:0.68}, sel=null, keysOnly=false, showLinks=true;

function build(){
  TABLES.forEach(function(t){
    var el=document.createElement('div');
    el.className='tbl'; el.id='t_'+t.name;
    el.style.left=t.x+'px'; el.style.top=t.y+'px';
    el.innerHTML='<h3><span class="dot" style="background:'+G[t.g].c+'"></span>'+
      (isDone(t.name)?'<span class="done" title="Reviewed and finalised"></span>':'')+t.name+
      '<span class="cnt">'+t.cols.length+'</span></h3><ul>'+
      t.cols.map(function(c){
        var pk=c.f.indexOf('p')>-1, fk=c.f.indexOf('f')>-1, nn=c.f.indexOf('n')<0;
        return '<li class="'+(nn?'nn':'')+' '+((pk||fk)?'iskey':'')+'">'+
          '<span class="k '+(pk?'pk':fk?'fk':'')+'">'+(pk?'PK':fk?'FK':'')+'</span>'+
          '<span class="c">'+c.n+'</span><span class="t">'+c.t+(nn?'':' ◇')+'</span></li>';
      }).join('')+'</ul>';
    world.appendChild(el);
    t.el=el;
    el.querySelector('h3').addEventListener('mousedown',function(e){ startDragTable(e,t); });
    el.addEventListener('click',function(e){ if(!dragged) select(t.name); e.stopPropagation(); });
  });
  // Re-stack each column from the rendered heights, so a long table never
  // overlaps the one below it however the fonts measure.
  var y2={};
  TABLES.forEach(function(t){
    var c=G[t.g].col; if(y2[c]===undefined) y2[c]=PADY;
    var h=t.el.offsetHeight||t.h; t.h=h; t.y=y2[c]; t.el.style.top=t.y+'px'; y2[c]=t.y+h+GAPY;
  });
  drawLinks();
  rail();
  apply();
}

function drawLinks(){
  var w=0,h=0;
  TABLES.forEach(function(t){ w=Math.max(w,t.x+260); h=Math.max(h,t.y+t.h+40); });
  links.setAttribute('width',w); links.setAttribute('height',h);
  var paths=R.map(function(r,i){
    var a=byName[r[0]], b=byName[r[2]];
    if(!a||!b) return '';
    var ax,ay,bx,by;
    var aRight = a.x < b.x;
    ax = aRight ? a.x+246 : a.x;
    bx = aRight ? b.x     : b.x+246;
    ay = a.y + a.h/2; by = b.y + b.h/2;
    var dx = Math.max(40, Math.abs(bx-ax)*0.45);
    var c1 = aRight ? ax+dx : ax-dx;
    var c2 = aRight ? bx-dx : bx+dx;
    return '<path id="l'+i+'" data-a="'+r[0]+'" data-b="'+r[2]+'" d="M'+ax+' '+ay+
           ' C'+c1+' '+ay+' '+c2+' '+by+' '+bx+' '+by+'"/>';
  }).join('');
  links.innerHTML=paths;
}

function apply(){
  world.style.transform='translate('+view.x+'px,'+view.y+'px) scale('+view.k+')';
}

function select(name){
  sel = (sel===name) ? null : name;
  var near={};
  if(sel){ near[sel]=1; R.forEach(function(r){ if(r[0]===sel) near[r[2]]=1; if(r[2]===sel) near[r[0]]=1; }); }
  TABLES.forEach(function(t){
    t.el.classList.toggle('sel', sel===t.name);
    t.el.classList.toggle('dim', !!sel && !near[t.name]);
  });
  links.querySelectorAll('path').forEach(function(p){
    var hot = sel && (p.dataset.a===sel || p.dataset.b===sel);
    p.classList.toggle('hot', !!hot);
    p.classList.toggle('dim', !!sel && !hot);
  });
  document.querySelectorAll('.ti').forEach(function(b){ b.classList.toggle('on', b.dataset.t===sel); });
  detail();
}

function detail(){
  var d=$('#detail');
  if(!sel){ d.classList.remove('on'); return; }
  var t=byName[sel];
  var out = R.filter(function(r){return r[0]===sel;});
  var inn = R.filter(function(r){return r[2]===sel;});
  d.className='detail on';
  d.innerHTML='<div class="dh"><div><div class="t">'+t.name+'</div>'+
    '<div class="g"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:'+
    G[t.g].c+';margin-right:6px"></span>'+G[t.g].label+' · '+t.cols.length+' columns</div></div>'+
    '<button class="x" id="dx">×</button></div><div class="db">'+
    '<p>'+t.note+'</p>'+
    (out.length?'<h4>References ('+out.length+')</h4>'+out.map(function(r){
      return '<div class="rel"><span class="a">'+r[1]+'</span><span class="b">→</span>'+
        '<button class="jump" data-j="'+r[2]+'">'+r[2]+'.'+r[3]+'</button></div>';}).join(''):'')+
    (inn.length?'<h4>Referenced by ('+inn.length+')</h4>'+inn.map(function(r){
      return '<div class="rel"><button class="jump" data-j="'+r[0]+'">'+r[0]+'</button>'+
        '<span class="b">·</span><span class="a">'+r[1]+'</span></div>';}).join(''):'')+
    '</div>';
  $('#dx').onclick=function(){ sel=null; select(null); };
  d.querySelectorAll('[data-j]').forEach(function(b){
    b.onclick=function(){ focus(b.dataset.j); select(b.dataset.j); };
  });
}

function focus(name){
  var t=byName[name]; if(!t) return;
  var r=stage.getBoundingClientRect();
  view.k=0.85;
  view.x = r.width/2 - (t.x+123)*view.k - 160;
  view.y = r.height/2 - (t.y+t.h/2)*view.k;
  apply();
}

function rail(){
  var html='', last=null;
  TABLES.forEach(function(t){
    if(t.g!==last){ last=t.g;
      html+='<div class="grp"><i style="background:'+G[t.g].c+'"></i>'+G[t.g].label+'</div>'; }
    html+='<button class="ti" data-t="'+t.name+'">'+
      (isDone(t.name)?'<span class="done"></span>':'<span class="done pending"></span>')+
      t.name+'<span class="n">'+t.cols.length+'</span></button>';
  });
  $('#list').innerHTML=html;
  var done=TABLES.filter(function(t){return isDone(t.name);}).length;
  $('#prog').textContent = done+' of '+TABLES.length+' reviewed';
  document.querySelectorAll('.ti').forEach(function(b){
    b.onclick=function(){ focus(b.dataset.t); select(b.dataset.t); };
  });
}

/* ---- pan, zoom, drag ---- */
var panning=false, px, py, dragT=null, dragged=false;
stage.addEventListener('mousedown',function(e){
  if(e.target.closest('.tbl')||e.target.closest('.ctl')||e.target.closest('.detail')) return;
  panning=true; dragged=false; px=e.clientX-view.x; py=e.clientY-view.y; stage.classList.add('drag');
});
window.addEventListener('mousemove',function(e){
  if(panning){ dragged=true; view.x=e.clientX-px; view.y=e.clientY-py; apply(); }
  else if(dragT){
    dragged=true;
    dragT.x = Math.round((e.clientX-view.x)/view.k - dragT.ox);
    dragT.y = Math.round((e.clientY-view.y)/view.k - dragT.oy);
    dragT.el.style.left=dragT.x+'px'; dragT.el.style.top=dragT.y+'px';
    drawLinks(); select(sel);
  }
});
window.addEventListener('mouseup',function(){
  panning=false; dragT=null; stage.classList.remove('drag');
  setTimeout(function(){dragged=false;},40);
});
function startDragTable(e,t){
  e.preventDefault(); e.stopPropagation();
  dragT=t; dragged=false;
  t.ox=(e.clientX-view.x)/view.k - t.x;
  t.oy=(e.clientY-view.y)/view.k - t.y;
}
stage.addEventListener('wheel',function(e){
  e.preventDefault();
  var f = e.deltaY<0 ? 1.1 : 0.9, r=stage.getBoundingClientRect();
  var mx=e.clientX-r.left, my=e.clientY-r.top;
  var nk=Math.min(2, Math.max(0.18, view.k*f));
  view.x = mx - (mx-view.x)*(nk/view.k);
  view.y = my - (my-view.y)*(nk/view.k);
  view.k = nk; apply();
},{passive:false});

document.querySelectorAll('[data-z]').forEach(function(b){
  b.onclick=function(){
    var z=b.dataset.z, r=stage.getBoundingClientRect();
    if(z==='Fit'){
      var w=0,h=0; TABLES.forEach(function(t){ w=Math.max(w,t.x+260); h=Math.max(h,t.y+t.h); });
      view.k=Math.min((r.width-60)/w,(r.height-60)/h);
      view.x=20; view.y=20;
    } else {
      var nk=Math.min(2,Math.max(0.18, view.k*(z==='in'?1.2:0.83)));
      view.x = r.width/2 - (r.width/2-view.x)*(nk/view.k);
      view.y = r.height/2 - (r.height/2-view.y)*(nk/view.k);
      view.k = nk;
    }
    apply();
  };
});
$('#keysBtn').onclick=function(){
  keysOnly=!keysOnly;
  this.classList.toggle('on',keysOnly);
  TABLES.forEach(function(t){
    t.el.classList.toggle('keys',keysOnly);
    t.h = t.el.offsetHeight || (keysOnly ? 34 + t.cols.filter(function(c){return /[pf]/.test(c.f);}).length*17 + 6
                   : 34 + t.cols.length*17 + 6);
  });
  drawLinks(); select(sel);
};
$('#relBtn').onclick=function(){
  showLinks=!showLinks;
  links.style.display = showLinks ? '' : 'none';
  this.classList.toggle('on',!showLinks);
  this.textContent = showLinks ? 'Hide links' : 'Show links';
};
/* ---- theme ---- */
var themeBtn=$('#themeBtn');
function setTheme(mode){
  document.documentElement.setAttribute('data-theme', mode);
  themeBtn.textContent = mode==='dark' ? 'Light' : 'Dark';
  themeBtn.classList.toggle('on', mode==='dark');
  try{ localStorage.setItem('sr_theme', mode); }catch(err){}
}
var stored=null;
try{ stored=localStorage.getItem('sr_theme'); }catch(err){}
setTheme(stored || (window.matchMedia &&
  window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
themeBtn.onclick=function(){
  setTheme(document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark');
};

$('#q').addEventListener('input',function(e){
  var q=e.target.value.toLowerCase();
  TABLES.forEach(function(t){
    var hit = !q || t.name.indexOf(q)>-1 || t.cols.some(function(c){return c.n.indexOf(q)>-1;});
    t.el.classList.toggle('dim', !hit);
  });
  document.querySelectorAll('.ti').forEach(function(b){
    b.style.display = (!q || b.dataset.t.indexOf(q)>-1) ? '' : 'none';
  });
});
stage.addEventListener('click',function(e){
  if(!e.target.closest('.tbl') && !e.target.closest('.detail') && !dragged){ sel=null; select(null); }
});

build();
document.querySelector('[data-z="fit"]').click();
})();
</script>
</body>
</html>
